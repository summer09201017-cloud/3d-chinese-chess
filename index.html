<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ★ 0909:原本是開發用的「3d-an」,分頁標題與加到主畫面的名字都會用它 -->
    <title>3D 中國象棋</title>
    <script>
      // 📡 統計打點三層(skill play-stats-lite / play-stats-dwell)。2026-09-05 使用者拍板:所有作品一律接統計,不再有「家庭系不接」的例外。
      //    零個資:只送「站 id + 事件(+秒數)」,沒有 cookie、沒有帳號、不記 IP。離線 / 被擋 / 本機預覽一律靜默 —— 統計是配菜,壞掉絕不影響遊戲。
      //    ★ 端點只有 /api/ping、秒數參數只認 t(0903 三站打到 404 一天多沒人發現的教訓;寫錯不會報錯,資料只會靜靜消失)。
      //    ★ 黑名單不白名單:只擋本機開發,搬站(pages.dev ↔ workers.dev)不會斷流(0813 約拿白名單斷流三週的教訓)。
      (function () {
        var ID = '3d-chinese-chess'
        var API = 'https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g='
        var LOCAL = ['localhost', '127.0.0.1', '::1', ''].indexOf(location.hostname) >= 0 || location.protocol === 'file:'
        window.psPing = function (evt, sec) {   // evt 例:ID(開啟)/ ID-done(完賽)/ ID-dwell(停留,帶秒)
          if (LOCAL) return
          try {
            var u = API + evt + (sec ? '&t=' + Math.round(sec) : '')
            if (navigator.sendBeacon) navigator.sendBeacon(u)
            else fetch(u, { mode: 'no-cors', keepalive: true }).catch(function () {})
          } catch (e) { /* 統計是配菜:不重試、不報錯 */ }
        }
        window.psDone = function () { window.psPing(ID + '-done') }   // ② 完賽:遊戲碼在「一局分出結果」那一刻呼叫
        window.psPing(ID)                                             // ① 開啟
        var t0 = Date.now(), sent = false
        function dwell () {                                           // ③ 真實停留:開頁到第一次離開,只發一次(遊戲語意,3~1800 秒才算)
          if (sent) return
          sent = true
          var sec = (Date.now() - t0) / 1000
          if (sec >= 3 && sec <= 1800) window.psPing(ID + '-dwell', sec)
        }
        addEventListener('pagehide', dwell)
        addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') dwell() })
      })()
    </script>
  <style id="mfsZoomStyle">
/* mfs-portrait-zoom v1 —— 勿手改;要改請改 skills/force-landscape-pwa/patches/add-portrait-zoom.mjs 後重打 */
#mfsFull{display:none}
@media (pointer:coarse){
  /* 只在觸控裝置、且還沒進全螢幕時出現;進了就自己藏 ⇒ 玩的時候不壓到棋盤/HUD。桌機不顯示(按 F11) */
  body:not(.mfs-fs) #mfsFull{position:fixed;display:flex;align-items:center;justify-content:center;
    top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));
    z-index:2147482000;width:42px;height:42px;padding:0;border-radius:11px;
    border:1px solid rgba(255,255,255,.42);background:rgba(9,15,19,.55);color:#fff;
    cursor:pointer;opacity:.55;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  body:not(.mfs-fs) #mfsFull:hover,body:not(.mfs-fs) #mfsFull:focus-visible{opacity:1}
}



</style>
</head>
  <body>
    <div id="root"></div>
    <!-- 🏷 版本徽章(艦隊鐵則⑦):內容由 src/App.jsx 從 src/version.js 填,頁面不寫死版號 -->
    <div id="appVerBadge"></div>
    <script type="module" src="/src/main.jsx"></script>
  <!-- mfs-portrait-zoom v1 -->
<button type="button" id="mfsFull" title="放大(全螢幕)" aria-label="放大(全螢幕)" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<script>
/* mfs-portrait-zoom v1 */
(function () {
  try {
    if (window.self !== window.top) { var f0 = document.getElementById('mfsFull'); if (f0) f0.remove(); return; } /* 嵌入時不搶宿主 */
    var targetSel = "";
    var fsEl = function () { return (targetSel && document.querySelector(targetSel)) || document.documentElement; };
    var isFs = function () { return !!(document.fullscreenElement || document.webkitFullscreenElement); };
    var immersive = false;
    var btn = document.getElementById('mfsFull');
    
    function refit() {
      /* Three.js / canvas 遊戲多半聽 resize 重算;版面剛變、要等一幀再發,不然量到舊尺寸 */
      requestAnimationFrame(function () { try { window.dispatchEvent(new Event('resize')); } catch (e) {} });
    }
    function paint() {
      try {
        document.body.classList.toggle('immersive', immersive);
        document.body.classList.toggle('mfs-fs', isFs());
        if (btn) { btn.setAttribute('aria-pressed', String(immersive)); var s = btn.querySelector('span'); if (s) s.textContent = immersive ? '縮小' : '放大'; }
      } catch (e) {}
      refit();
    }
    function toggle() {
      immersive = !immersive;
      try {
        var el = fsEl();
        var req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
        var out = document.exitFullscreen || document.webkitExitFullscreen;
        if (immersive && req && !isFs()) { var p = req.call(el); if (p && p.catch) p.catch(function () {}); }
        else if (!immersive && isFs() && out) { var q = out.call(document); if (q && q.catch) q.catch(function () {}); }
      } catch (e) { /* iOS Safari 不支援網頁全螢幕:只吃 immersive 樣式,不能炸遊戲 */ }
      paint();
    }
    if (btn) btn.addEventListener('click', toggle);
    /* 使用者按 Esc / 系統手勢退出全螢幕 ⇒ 沉浸樣式也收;只在支援全螢幕的裝置跟隨(iPhone 沒這事件,跟隨會誤關) */
    var supports = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
    if (supports) ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
      document.addEventListener(ev, function () { if (!isFs() && immersive) { immersive = false; } paint(); });
    });
    paint();
  } catch (e) {}
})();
</script>
</body>
</html>
